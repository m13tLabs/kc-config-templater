[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kc-config-templater"
version = "0.1.0"
description = "Structurally discover and templatize secrets in keycloak-config-cli realm exports, so they never need to be hand-mapped or committed to git."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "m13t" }
]
keywords = ["keycloak", "keycloak-config-cli", "helm", "secrets", "iac"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/m13tLabs/kc-config-templater"
Issues = "https://github.com/m13tLabs/kc-config-templater/issues"

[project.scripts]
kc-config-templater = "kc_config_templater.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/kc_config_templater"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
