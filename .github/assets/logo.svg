<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140" role="img" aria-label="kc-config-templater">
  <title>kc-config-templater</title>
  <defs>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <rect x="24" y="20" width="100" height="100" rx="24" fill="url(#lock)"/>

  <!-- padlock: the secret, discovered and about to be swapped for a placeholder -->
  <path d="M60 64 V52 A14 14 0 0 1 88 52 V64" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <rect x="54" y="62" width="40" height="34" rx="7" fill="#ffffff"/>
  <circle cx="74" cy="76" r="4.5" fill="#1f2937"/>
  <rect x="71.5" y="80" width="5" height="10" rx="2" fill="#1f2937"/>

  <!-- overlay badge: the placeholder it becomes -->
  <circle cx="100" cy="92" r="19" fill="#ffffff"/>
  <circle cx="100" cy="92" r="16" fill="url(#lock)"/>
  <text x="100" y="93" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">{ }</text>

  <!-- wordmark -->
  <text x="146" y="84" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="32" font-weight="700">
    <tspan fill="#0D9488">kc</tspan><tspan fill="#8A9199">-config-templater</tspan>
  </text>
  <text x="148" y="107" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.4" fill="#8A9199">secrets out, placeholders in</text>
</svg>
