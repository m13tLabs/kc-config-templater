name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build: patch, minor, major, or custom'
        type: choice
        options: [patch, minor, major, custom]
        default: patch
        required: true
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ''
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: false
        default: true

jobs:
  release:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-release.yml@main
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      images: '["ghcr.io/m13tlabs/kc-config-templater","docker.io/m13t/kc-config-templater"]'
      client_id: ${{ vars.CI_CLIENT_ID }}
      release_type: ${{ inputs.release_type || 'patch' }}
      custom_version: ${{ inputs.custom_version }}
      default_branch: ${{ github.ref_name }}
      # Keep pyproject.toml's version in sync with config.json, so the wheel
      # built for PyPI below carries the released version.
      bump_command: |
        sed -i -E "s/^version = \"[^\"]*\"\$/version = \"${RELEASE_VERSION}\"/" pyproject.toml
        grep -q "^version = \"${RELEASE_VERSION}\"\$" pyproject.toml
      draft_release: ${{ inputs.draft_release }}
      dockerhub: true
    secrets: inherit

  # Built from the release commit: pyproject.toml already carries the released
  # version (pinned above), and a draft release has no v<version> tag yet.
  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing to PyPI
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
