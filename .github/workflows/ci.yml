name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kc-config-templater:ci .
      - name: Smoke test
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          echo '{"realm":"smoke","clients":[{"clientId":"demo","secret":"fakeSecretForCiOnly"}]}' > raw.json
          # The image's baked-in non-root user (kcct) won't generally match
          # whichever UID owns the mounted directory, so pass ours through.
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/work kc-config-templater:ci \
            template --in-raw raw.json --out-templated templated.json --out-secrets secrets.yaml
          grep -q '{{ \$.Values.keycloakConfigCli.configSecret.clients.demo }}' templated.json
          grep -q 'kcClientDemoClientSecret: fakeSecretForCiOnly' secrets.yaml

  build-results:
    name: Build results
    if: always()
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
